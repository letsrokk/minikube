repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: seaweedfs
    url: https://seaweedfs.github.io/seaweedfs/helm
  - name: aws-mountpoint-s3-csi-driver
    url: https://awslabs.github.io/mountpoint-s3-csi-driver
---
helmDefaults:
  atomic: true
  wait: true
  timeout: 600
  createNamespace: true
---
environments:
  default:
    values:
      - environments/minikube/values.yaml
  minikube:
    values:
      - environments/minikube/values.yaml
---
releases:
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.14.1
    values:
      - environments/minikube/ingress-nginx-values.yaml

  - name: seaweedfs
    namespace: seaweedfs
    needs:
      - ingress-nginx/ingress-nginx
    chart: seaweedfs/seaweedfs
    version: 4.20.0
    values:
      - environments/minikube/seaweedfs-values.yaml.gotmpl

  - name: aws-mountpoint-s3-csi-driver
    namespace: kube-system
    needs:
      - seaweedfs/seaweedfs
    chart: ./charts/aws-mountpoint-s3-csi-driver-wrapper
    values:
      - environments/minikube/aws-mountpoint-s3-csi-driver-wrapper-values.yaml.gotmpl
